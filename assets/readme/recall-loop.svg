<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">LMF4 session memory loop</title><desc id="d">A user message triggers associative recall, relevant memories enter context, the session produces new decisions and learnings, and extraction stores them for the future.</desc><rect width="1200" height="390" rx="28" fill="#080d18"/><text x="55" y="62" fill="#f3f1fa" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Every session reads the past and writes the future.</text><g font-family="system-ui,sans-serif"><g fill="#11172a" stroke="#8769d7" stroke-width="2"><rect x="45" y="115" width="245" height="185" rx="20"/><rect x="335" y="115" width="245" height="185" rx="20"/><rect x="625" y="115" width="245" height="185" rx="20"/><rect x="915" y="115" width="240" height="185" rx="20"/></g><g fill="#aa8df2" font-family="ui-monospace,monospace" font-size="16" font-weight="700"><text x="72" y="153">MESSAGE</text><text x="362" y="153">RECALL</text><text x="652" y="153">SESSION</text><text x="942" y="153">EXTRACT</text></g><g fill="#f3f1fa" font-size="22" font-weight="700"><text x="72" y="198">You ask</text><text x="362" y="198">Search memory.db</text><text x="652" y="198">Work with context</text><text x="942" y="198">Save what mattered</text></g><g fill="#9da8bc" font-size="17"><text x="72" y="232">project question</text><text x="362" y="232">FTS5 + semantic</text><text x="652" y="232">decide, fix, learn</text><text x="942" y="232">structured rows</text><text x="72" y="259">new conversation</text><text x="362" y="259">inject relevance</text><text x="652" y="259">without repeating</text><text x="942" y="259">indexed for recall</text></g></g><g stroke="#b191ff" stroke-width="4"><path d="M295 207h35M585 207h35M875 207h35"/></g><path d="M1035 315C900 370 300 370 165 315" fill="none" stroke="#43d59b" stroke-width="3" stroke-dasharray="9 9"/><text x="600" y="360" text-anchor="middle" fill="#43d59b" font-family="ui-monospace,monospace" font-size="17">the next session starts richer</text></svg>
