<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d"><title id="t">LMF4 privacy boundary</title><desc id="d">Conversation data remains on local machines and an owner-controlled private GitHub backup repository, with no telemetry or third-party memory service.</desc><rect width="1200" height="380" rx="28" fill="#080d18"/><text x="55" y="62" fill="#f3f1fa" font-family="system-ui,sans-serif" font-size="31" font-weight="750">Your memory stays inside your boundary.</text><rect x="55" y="105" width="710" height="215" rx="23" fill="#0d2725" stroke="#43d59b" stroke-width="2"/><text x="86" y="148" fill="#43d59b" font-family="ui-monospace,monospace" font-size="17" font-weight="700">OWNER CONTROLLED</text><g fill="#edf8f5" font-family="system-ui,sans-serif" font-size="22" font-weight="650"><text x="86" y="194">✓ Local SQLite + transcripts</text><text x="86" y="235">✓ Local MEMORY + LIBRARY</text><text x="86" y="276">✓ Your private GitHub backup</text></g><rect x="815" y="105" width="330" height="215" rx="23" fill="#181520" stroke="#665c74" stroke-width="2"/><text x="846" y="148" fill="#a99db5" font-family="ui-monospace,monospace" font-size="17" font-weight="700">NOT IN THE LOOP</text><g fill="#ddd6e4" font-family="system-ui,sans-serif" font-size="21" font-weight="650"><text x="846" y="194">— Telemetry</text><text x="846" y="235">— Analytics</text><text x="846" y="276">— Memory SaaS</text></g><text x="600" y="355" text-anchor="middle" fill="#8391a6" font-family="ui-monospace,monospace" font-size="17">ForeverCommit remains opt-in, off by default, and guarded four ways.</text></svg>
